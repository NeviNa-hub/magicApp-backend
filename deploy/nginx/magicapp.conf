# MagicApp 后端内网反向代理（Ubuntu nginx 1.18）
#
# 服务器部署：
#   cp deploy/nginx/magicapp.conf /etc/nginx/sites-available/magicapp.conf
#   ln -s /etc/nginx/sites-available/magicapp.conf /etc/nginx/sites-enabled/magicapp.conf
#   nginx -t && systemctl reload nginx
# 之后改配置只需重复 cp -> nginx -t -> reload，软链不用重建。
#
# 上游：systemd 服务 magicapp-api
#   uvicorn app.main:app --host 127.0.0.1 --port 8001

upstream magicapp_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    # 只监听内网地址：同一内网或 VPN 内可达，公网与移动网络不可达。
    listen 172.22.121.135:80;
    server_name 172.22.121.135;

    # 当前接口只有 JSON 请求体，10m 足够；没有大文件上传需求就不要放大。
    client_max_body_size 10m;

    access_log /var/log/nginx/magicapp_access.log;
    error_log /var/log/nginx/magicapp_error.log warn;

    # nginx 与上游同机，连不上应快速返回 502，而不是长时间挂住。
    proxy_connect_timeout 5s;
    # 给数据库慢查询留余量；前端自身超时更短时以前端为准。
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # 以下 proxy 参数定义在 server 级，被所有 location 继承。
    # 注意：location 内一旦再写 proxy_set_header，本级的继承会整体失效。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 路径前缀保留的关键：proxy_pass 后面不带 URI（不能以 / 或路径结尾）。
    # /api/health 会原样转发为 http://127.0.0.1:8001/api/health。
    # 若写成 proxy_pass http://magicapp_api/; ，location 前缀 /api/ 会被替换掉，
    # 上游收到 /health，所有接口 404。
    location /api/ {
        proxy_pass http://magicapp_api;
    }

    # 接口文档默认关闭：返回 404 而不是 403，避免暴露"这里原本有文档"。
    # /docs、/redoc、/openapi.json 会列出全部接口与参数结构，本服务没有鉴权门槛，
    # 内网也不能保证只有自己人访问，因此默认不对外。
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # 联调需要看文档时：注释掉上面三行关闭块，启用下面这块后 reload。
    # Swagger 页面的 JS/CSS 来自公网 CDN，浏览器无外网时页面会白屏，
    # 但 /openapi.json 本身是纯 JSON，不受影响。
    #location ~ ^/(docs|redoc|openapi\.json)$ {
    #    proxy_pass http://magicapp_api;
    #}

    # 其余路径不提供服务，避免顺带暴露 /usr/share/nginx/html 下的默认页。
    location / {
        return 404;
    }
}
